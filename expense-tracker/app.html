<title>Monthly Spend Tracker</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b0f0d; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #ffffff; }
  #app-root { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; background: #0b0f0d; }
  .scr::-webkit-scrollbar { display: none; }
  .scr { scrollbar-width: none; }
  input, select, button { font-family: inherit; }
  .et-input {
    width: 100%; border: 1px solid rgba(255,255,255,0.14); border-radius: 12px;
    padding: 12px 14px; font-size: 16px; color: #ffffff; background: #1c2220; outline: none;
  }
  .et-input:focus { border-color: #2fe6ac; }
  .et-input::placeholder { color: #7d8580; }
  .et-btn-primary {
    background: #2fe6ac; color: #06140f; border: none; border-radius: 14px;
    padding: 15px; font-size: 16px; font-weight: 700; width: 100%; cursor: pointer;
  }
  .et-btn-primary:disabled { background: #262b28; color: #686f6b; cursor: default; }
  .et-btn-ghost {
    background: rgba(255,255,255,0.07); color: #ffffff; border: 1px solid rgba(255,255,255,0.14); border-radius: 12px;
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .et-navbtn { background: none; border: none; cursor: pointer; padding: 8px 0; }
  .et-row { cursor: pointer; }
  .et-row:active { background: rgba(255,255,255,0.05); }
  .et-toast { animation: et-toast-in .2s ease-out; }
  @keyframes et-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  a.et-link { color: #2fe6ac; text-decoration: none; font-weight: 600; }
  a.et-link:hover { color: #7ff2d9; }
  .pill { border: none; border-radius: 20px; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 8px 14px; }
</style>
<div id="app-root"></div>
<script>
(function () {
  'use strict';

  try {
    var head = document.head;
    var metas = [
      ['apple-mobile-web-app-capable', 'yes'],
      ['mobile-web-app-capable', 'yes'],
      ['apple-mobile-web-app-title', 'Spend Tracker'],
      ['apple-mobile-web-app-status-bar-style', 'black-translucent'],
      ['theme-color', '#0b0f0d']
    ];
    metas.forEach(function (pair) {
      var m = document.createElement('meta');
      m.name = pair[0]; m.content = pair[1];
      head.appendChild(m);
    });
  } catch (e) {}

  var CATEGORIES = [
    { id: 'groceries', name: 'Groceries', color: '#3987e5' },
    { id: 'dining', name: 'Dining & Takeout', color: '#d95926' },
    { id: 'transport', name: 'Transport & Fuel', color: '#199e70' },
    { id: 'rent', name: 'Rent & Utilities', color: '#c98500' },
    { id: 'shopping', name: 'Shopping & Clothing', color: '#d55181' },
    { id: 'subscriptions', name: 'Subscriptions', color: '#3ab53a' },
    { id: 'entertainment', name: 'Entertainment', color: '#9085e9' },
    { id: 'travel', name: 'Travel', color: '#e66767' }
  ];
  var CAT_BY_ID = {};
  CATEGORIES.forEach(function (c) { CAT_BY_ID[c.id] = c; });

  var CARD_ISSUERS = [
    { id: 'discover', name: 'Discover' },
    { id: 'amex', name: 'Amex' },
    { id: 'capitalone', name: 'Capital One' },
    { id: 'macys', name: "Macy's" },
    { id: 'chase', name: 'Chase' }
  ];
  var CARD_BY_ID = {};
  CARD_ISSUERS.forEach(function (c) { CARD_BY_ID[c.id] = c; });

  var STORAGE_KEY = 'et_data_v2';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function nowMonthKey() { return todayISO().slice(0, 7); }
  function monthKeyOf(dateStr) { return dateStr.slice(0, 7); }
  function addMonths(monthKey, delta) {
    var parts = monthKey.split('-'); var y = parseInt(parts[0], 10); var m = parseInt(parts[1], 10) - 1;
    m += delta; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + pad2(m + 1);
  }
  function monthLabel(monthKey) {
    var parts = monthKey.split('-'); var y = parseInt(parts[0], 10); var m = parseInt(parts[1], 10) - 1;
    var d = new Date(y, m, 1);
    return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }
  function daysInMonthOf(monthKey) {
    var parts = monthKey.split('-'); var y = parseInt(parts[0], 10); var m = parseInt(parts[1], 10);
    return new Date(y, m, 0).getDate();
  }
  function fmtMoney(n) {
    var v = (n === null || n === undefined || isNaN(n)) ? 0 : n;
    return v.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  }
  function shiftDay(dateStr, delta) {
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    d.setDate(d.getDate() + delta);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fmtDateGroup(dateStr) {
    var today = todayISO(); var yest = shiftDay(today, -1);
    if (dateStr === today) return 'Today';
    if (dateStr === yest) return 'Yesterday';
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function hexToRgba(hex, alpha) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  function arcPath(cx, cy, rOuter, rInner, startA, endA) {
    var x0 = cx + rOuter * Math.cos(startA), y0 = cy + rOuter * Math.sin(startA);
    var x1 = cx + rOuter * Math.cos(endA), y1 = cy + rOuter * Math.sin(endA);
    var x2 = cx + rInner * Math.cos(endA), y2 = cy + rInner * Math.sin(endA);
    var x3 = cx + rInner * Math.cos(startA), y3 = cy + rInner * Math.sin(startA);
    var largeArc = (endA - startA) > Math.PI ? 1 : 0;
    return 'M ' + x0 + ' ' + y0 + ' A ' + rOuter + ' ' + rOuter + ' 0 ' + largeArc + ' 1 ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2 + ' A ' + rInner + ' ' + rInner + ' 0 ' + largeArc + ' 0 ' + x3 + ' ' + y3 + ' Z';
  }

  function categoryIconSvg(categoryId, color, size) {
    var inner = '';
    switch (categoryId) {
      case 'groceries':
        inner = '<path d="M6 8h12l-1.2 11.5a1 1 0 0 1-1 .9H8.2a1 1 0 0 1-1-.9L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>';
        break;
      case 'dining':
        inner = '<path d="M8.5 2v6.5a1.3 1.3 0 0 0 2.6 0V2"/><path d="M8.5 2v3.2M10.8 2v3.2M9.8 8.5V21"/><path d="M15.5 2c1.8 2.6 1.8 5.4 0 7.5l-.8.9V21"/>';
        break;
      case 'transport':
        inner = '<path d="M4 15.5l1.2-4.6A2 2 0 0 1 7.1 9.5h9.8a2 2 0 0 1 1.9 1.4l1.2 4.6"/><path d="M2.8 15.5h18.4v3.2a1 1 0 0 1-1 1h-1.1a1 1 0 0 1-1-1v-1.2H6.1v1.2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3.2z"/><circle cx="7.2" cy="18.4" r="1.3"/><circle cx="16.8" cy="18.4" r="1.3"/>';
        break;
      case 'rent':
        inner = '<path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1h4.2v-6.2h2.6v6.2h4.2a1 1 0 0 0 1-1V10"/>';
        break;
      case 'shopping':
        inner = '<path d="M8.2 3.6l3.8 2 3.8-2 3 2.8-2.4 2.4v11.3a1 1 0 0 1-1 1H8.6a1 1 0 0 1-1-1V8.8L5.2 6.4z"/>';
        break;
      case 'subscriptions':
        inner = '<path d="M4 12a8 8 0 0 1 13.6-5.7M18.4 3.8v4.2h-4.2"/><path d="M20 12a8 8 0 0 1-13.6 5.7M5.6 20.2V16h4.2"/>';
        break;
      case 'entertainment':
        inner = '<path d="M3 9.2h18"/><path d="M4.2 9.2l1.3-4h2.7l-1 4M9.4 9.2l1-4h2.7l-1 4M14.6 9.2l1-4h2.7l-1 4"/><rect x="3" y="9.2" width="18" height="10.8" rx="1.4"/>';
        break;
      case 'travel':
        inner = '<path d="M21 3L3.5 10l6.7 2.6M21 3l-6.5 17.5-2.3-7.9M21 3l-10.8 9.6"/>';
        break;
    }
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }

  var App = {
    state: {
      tab: 'home',
      expenses: [],
      budgets: { overall: null, byCategory: {} },
      recurringTemplates: [],
      historyMonth: nowMonthKey(),
      insightsMonth: nowMonthKey(),
      historyFilter: 'all',
      categoryChartMode: 'donut',
      formAmount: '', formCategory: null, formDate: todayISO(), formNote: '', formMethod: 'card', formCardIssuer: null, formRecurring: false,
      overallBudgetInput: '', editingOverall: false,
      editingCat: null, catBudgetInput: '',
      confirmDeleteId: null, toastMsg: null, toastToken: null, hoverDayIndex: null,
      showBackup: false, restoreText: '', restoreError: null, storageWarning: false
    },

    storageProbe: function () {
      try {
        var k = '__et_probe__';
        window.localStorage.setItem(k, '1');
        var ok = window.localStorage.getItem(k) === '1';
        window.localStorage.removeItem(k);
        return ok;
      } catch (e) { return false; }
    },
    load: function () {
      if (!this.storageProbe()) { this.state.storageWarning = true; }
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var data = JSON.parse(raw);
          this.state.expenses = data.expenses || [];
          this.state.budgets = data.budgets || { overall: null, byCategory: {} };
          this.state.recurringTemplates = data.recurringTemplates || [];
        }
      } catch (e) { this.state.storageWarning = true; }
    },
    persist: function () {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
          expenses: this.state.expenses,
          budgets: this.state.budgets,
          recurringTemplates: this.state.recurringTemplates
        }));
        var raw = window.localStorage.getItem(STORAGE_KEY);
        var roundTrip = raw && JSON.parse(raw).expenses.length === this.state.expenses.length;
        if (!roundTrip) { this.state.storageWarning = true; }
        return !!roundTrip;
      } catch (e) { this.state.storageWarning = true; return false; }
    },

    openBackup: function () { this.set({ showBackup: true, restoreText: '', restoreError: null }); },
    closeBackup: function () { this.set({ showBackup: false, restoreText: '', restoreError: null }); },
    backupJson: function () {
      return JSON.stringify({
        expenses: this.state.expenses,
        budgets: this.state.budgets,
        recurringTemplates: this.state.recurringTemplates,
        exportedAt: new Date().toISOString()
      }, null, 2);
    },
    copyBackup: function () {
      var text = this.backupJson();
      var self = this;
      var done = function (ok) { self.showToast(ok ? 'Copied to clipboard' : 'Could not copy — select the text and copy manually'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      } else {
        try {
          var ta = document.getElementById('backupTextarea');
          ta.select();
          var ok = document.execCommand('copy');
          done(ok);
        } catch (e) { done(false); }
      }
    },
    onRestoreTextInput: function (v) { this.setQuiet({ restoreText: v, restoreError: null }); },
    restoreBackup: function () {
      var raw = this.state.restoreText.trim();
      if (!raw) return;
      var data;
      try { data = JSON.parse(raw); } catch (e) { this.set({ restoreError: 'That doesn’t look like valid backup text.' }); return; }
      if (!data || !Array.isArray(data.expenses)) { this.set({ restoreError: 'That doesn’t look like a Monthly Spend Tracker backup.' }); return; }
      var proceed = window.confirm('Replace all current data with this backup? This cannot be undone.');
      if (!proceed) return;
      this.state.expenses = data.expenses || [];
      this.state.budgets = data.budgets || { overall: null, byCategory: {} };
      this.state.recurringTemplates = data.recurringTemplates || [];
      var ok = this.persist();
      this.set({ showBackup: false, restoreText: '', restoreError: null });
      this.showToast(ok ? 'Backup restored' : 'Restored, but could not save to this device');
    },
    set: function (patch) {
      Object.assign(this.state, patch);
      this.render();
    },
    setQuiet: function (patch) {
      Object.assign(this.state, patch);
    },

    showToast: function (msg) {
      var token = uid();
      this.set({ toastMsg: msg, toastToken: token });
      var self = this;
      setTimeout(function () {
        if (self.state.toastToken === token) self.set({ toastMsg: null, toastToken: null });
      }, 2200);
    },

    selectTab: function (tab) { this.set({ tab: tab }); },
    goAddFromHome: function () { this.set({ tab: 'add' }); },
    goHistoryFromHome: function () { this.set({ tab: 'history' }); },

    pickCategory: function (id) { this.set({ formCategory: id }); },
    setMethod: function (m) { this.set({ formMethod: m, formCardIssuer: m === 'cash' ? null : this.state.formCardIssuer }); },
    setCardIssuer: function (id) { this.set({ formCardIssuer: id }); },
    toggleRecurring: function () { this.set({ formRecurring: !this.state.formRecurring }); },
    onAmountInput: function (v) { this.setQuiet({ formAmount: v }); this.refreshSaveButton(); },
    onDateInput: function (v) { this.setQuiet({ formDate: v }); },
    onNoteInput: function (v) { this.setQuiet({ formNote: v }); },
    refreshSaveButton: function () {
      var btn = document.getElementById('saveExpenseBtn');
      if (!btn) return;
      var canSave = !!(parseFloat(this.state.formAmount) > 0 && this.state.formCategory);
      btn.disabled = !canSave;
    },

    saveExpense: function () {
      var amt = parseFloat(this.state.formAmount);
      if (!amt || amt <= 0 || !this.state.formCategory) return;
      var noteTrim = (this.state.formNote || '').trim();
      var expense = {
        id: uid(), amount: amt, categoryId: this.state.formCategory,
        date: this.state.formDate || todayISO(), note: noteTrim, method: this.state.formMethod,
        cardIssuer: this.state.formMethod === 'card' ? this.state.formCardIssuer : null,
        recurringId: null
      };
      var templates = this.state.recurringTemplates.slice();
      if (this.state.formRecurring) {
        var existingIdx = -1;
        for (var i = 0; i < templates.length; i++) {
          if (templates[i].categoryId === expense.categoryId && (templates[i].note || '').toLowerCase() === noteTrim.toLowerCase()) { existingIdx = i; break; }
        }
        if (existingIdx !== -1) {
          var updated = Object.assign({}, templates[existingIdx], { amount: amt, method: expense.method, cardIssuer: expense.cardIssuer, lastLoggedMonth: nowMonthKey() });
          templates[existingIdx] = updated;
          expense.recurringId = updated.id;
        } else {
          var tpl = { id: uid(), categoryId: expense.categoryId, note: noteTrim, amount: amt, method: expense.method, cardIssuer: expense.cardIssuer, lastLoggedMonth: nowMonthKey() };
          templates.push(tpl);
          expense.recurringId = tpl.id;
        }
      }
      this.state.expenses = this.state.expenses.concat([expense]);
      this.state.recurringTemplates = templates;
      var ok = this.persist();
      this.set({
        formAmount: '', formCategory: null, formNote: '', formMethod: 'card', formCardIssuer: null, formRecurring: false, formDate: todayISO(),
        tab: 'home'
      });
      this.showToast(ok ? 'Expense added' : 'Added, but could not save to this device');
    },

    confirmRecurring: function (templateId) {
      var tpl = null;
      for (var i = 0; i < this.state.recurringTemplates.length; i++) { if (this.state.recurringTemplates[i].id === templateId) { tpl = this.state.recurringTemplates[i]; break; } }
      if (!tpl) return;
      var expense = { id: uid(), amount: tpl.amount, categoryId: tpl.categoryId, date: todayISO(), note: tpl.note, method: tpl.method, cardIssuer: tpl.cardIssuer || null, recurringId: tpl.id };
      this.state.expenses = this.state.expenses.concat([expense]);
      this.state.recurringTemplates = this.state.recurringTemplates.map(function (t) {
        return t.id === templateId ? Object.assign({}, t, { lastLoggedMonth: nowMonthKey() }) : t;
      });
      this.persist();
      this.set({});
      this.showToast('Logged ' + fmtMoney(tpl.amount));
    },

    requestDelete: function (id) { this.set({ confirmDeleteId: id }); },
    cancelDelete: function () { this.set({ confirmDeleteId: null }); },
    performDelete: function () {
      var id = this.state.confirmDeleteId;
      this.state.expenses = this.state.expenses.filter(function (e) { return e.id !== id; });
      this.persist();
      this.set({ confirmDeleteId: null });
    },

    shiftHistoryMonth: function (delta) {
      var next = addMonths(this.state.historyMonth, delta);
      if (next > nowMonthKey()) return;
      this.set({ historyMonth: next });
    },
    shiftInsightsMonth: function (delta) {
      var next = addMonths(this.state.insightsMonth, delta);
      if (next > nowMonthKey()) return;
      this.set({ insightsMonth: next });
    },
    setHistoryFilter: function (id) { this.set({ historyFilter: id }); },
    setChartMode: function (mode) { this.set({ categoryChartMode: mode }); },

    onOverallBudgetInput: function (v) { this.setQuiet({ overallBudgetInput: v }); },
    startEditOverall: function () { this.set({ editingOverall: true, overallBudgetInput: this.state.budgets.overall ? String(this.state.budgets.overall) : '' }); },
    saveOverallBudget: function () {
      var v = parseFloat(this.state.overallBudgetInput);
      this.state.budgets = Object.assign({}, this.state.budgets, { overall: (v && v > 0) ? v : null });
      this.persist();
      this.set({ overallBudgetInput: '', editingOverall: false });
    },
    startEditCatBudget: function (catId, current) { this.set({ editingCat: catId, catBudgetInput: current ? String(current) : '' }); },
    onCatBudgetInput: function (v) { this.setQuiet({ catBudgetInput: v }); },
    saveCatBudget: function () {
      var catId = this.state.editingCat;
      if (!catId) return;
      var v = parseFloat(this.state.catBudgetInput);
      var byCat = Object.assign({}, this.state.budgets.byCategory);
      if (v && v > 0) byCat[catId] = v; else delete byCat[catId];
      this.state.budgets = Object.assign({}, this.state.budgets, { byCategory: byCat });
      this.persist();
      this.set({ editingCat: null, catBudgetInput: '' });
    },

    onChartHover: function (idx) { this.set({ hoverDayIndex: idx }); },
    onChartLeave: function () { this.set({ hoverDayIndex: null }); },

    enrichExpenseRow: function (e) {
      var cat = CAT_BY_ID[e.categoryId];
      var methodLabel = e.method === 'cash' ? 'Cash' : (e.cardIssuer && CARD_BY_ID[e.cardIssuer] ? 'Card · ' + CARD_BY_ID[e.cardIssuer].name : 'Card');
      return {
        id: e.id, categoryId: e.categoryId, color: cat.color, catName: cat.name,
        label: e.note ? e.note : cat.name,
        amountLabel: fmtMoney(e.amount),
        dateLabel: fmtDateGroup(e.date),
        methodLabel: methodLabel
      };
    },

    render: function () {
      var s = this.state;
      var nowKey = nowMonthKey();
      var view = '';
      if (s.tab === 'home') view = this.renderHome(nowKey);
      else if (s.tab === 'add') view = this.renderAdd();
      else if (s.tab === 'history') view = this.renderHistory(nowKey);
      else if (s.tab === 'budgets') view = this.renderBudgets(nowKey);
      else if (s.tab === 'insights') view = this.renderInsights(nowKey);

      var html = '<div style="display:flex;flex-direction:column;height:100vh;min-height:100vh;position:relative;overflow:hidden;">'
        + view
        + this.renderNav()
        + this.renderModal()
        + this.renderBackup()
        + this.renderToast()
        + '</div>';
      document.getElementById('app-root').innerHTML = html;
      this.refreshSaveButton();
    },

    renderHome: function (nowKey) {
      var s = this.state;
      var homeExpenses = s.expenses.filter(function (e) { return monthKeyOf(e.date) === nowKey; });
      var homeTotal = homeExpenses.reduce(function (a, e) { return a + e.amount; }, 0);
      var overallBudget = s.budgets.overall;
      var overallPct = overallBudget ? Math.min(100, homeTotal / overallBudget * 100) : 0;
      var overallBarColor = !overallBudget ? '#2fe6ac' : (homeTotal / overallBudget >= 1 ? '#d03b3b' : (homeTotal / overallBudget >= 0.8 ? '#fab219' : '#2fe6ac'));

      var self = this;
      var dueTemplates = s.recurringTemplates.filter(function (t) { return t.lastLoggedMonth !== nowKey; });
      var recentList = homeExpenses.slice().sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return a.id < b.id ? 1 : -1;
      }).slice(0, 5).map(function (e) { return self.enrichExpenseRow(e); });

      var h = '<div class="scr" style="flex:1;overflow-y:auto;padding:22px 20px 16px;">';

      if (s.storageWarning) {
        h += '<div style="background:rgba(208,59,59,0.14);border:1px solid rgba(208,59,59,0.4);border-radius:14px;padding:12px 14px;margin-bottom:16px;">';
        h += '<div style="font-size:13px;font-weight:700;color:#ff8f8f;margin-bottom:3px;">This device may not be saving data reliably</div>';
        h += '<div style="font-size:12.5px;color:#e0b8b8;">Tap "Backup your data" below and copy it somewhere safe after each session, just in case.</div></div>';
      }

      h += '<div style="background:linear-gradient(135deg, rgba(47,230,172,0.18), rgba(22,26,24,0) 60%),#161a18;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:20px;margin-bottom:22px;">';

    renderInsights: function (nowKey) {
      var s = this.state;
      var canGoNext = addMonths(s.insightsMonth, 1) <= nowKey;
      var insightsExpenses = s.expenses.filter(function (e) { return monthKeyOf(e.date) === s.insightsMonth; });
      var insightsTotal = insightsExpenses.reduce(function (a, e) { return a + e.amount; }, 0);
      var prevMonthKey = addMonths(s.insightsMonth, -1);
      var prevExpenses = s.expenses.filter(function (e) { return monthKeyOf(e.date) === prevMonthKey; });
      var prevTotal = prevExpenses.reduce(function (a, e) { return a + e.amount; }, 0);
      var deltaAmt = insightsTotal - prevTotal;
      var deltaIsLess = deltaAmt <= 0;
      var hasData = insightsExpenses.length > 0;

      var h = '<div class="scr" style="flex:1;overflow-y:auto;padding:22px 20px 24px;">';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">';
      h += '<div style="font-size:20px;font-weight:700;">Insights</div><div style="display:flex;align-items:center;gap:10px;">';
      h += '<button class="et-navbtn" onclick="App.shiftInsightsMonth(-1)" style="font-size:18px;padding:2px 8px;color:#c3c2b7;">&#8249;</button>';
      h += '<div style="font-size:13.5px;font-weight:600;min-width:96px;text-align:center;">' + esc(monthLabel(s.insightsMonth)) + '</div>';
      h += '<button class="et-navbtn" onclick="App.shiftInsightsMonth(1)" style="font-size:18px;padding:2px 8px;color:#c3c2b7;' + (canGoNext ? '' : 'opacity:0.3;pointer-events:none;') + '">&#8250;</button></div></div>';

      if (!hasData) {
        h += '<div style="text-align:center;padding:48px 10px;font-size:14.5px;color:#898781;">No spending recorded for ' + esc(monthLabel(s.insightsMonth)) + '.</div></div>';
        return h;
      }

      var catTotalsRaw = CATEGORIES.map(function (c) {
        var total = insightsExpenses.filter(function (e) { return e.categoryId === c.id; }).reduce(function (a, e) { return a + e.amount; }, 0);
        return { id: c.id, name: c.name, color: c.color, total: total };
      }).filter(function (c) { return c.total > 0; });
      catTotalsRaw.sort(function (a, b) { return b.total - a.total; });
      var maxCatTotal = catTotalsRaw.length ? catTotalsRaw[0].total : 0;

      var donutSegments = [];
      if (insightsTotal > 0) {
        var angle = -Math.PI / 2;
        var gap = catTotalsRaw.length > 1 ? 0.05 : 0;
        catTotalsRaw.forEach(function (c) {
          var sweep = Math.min((c.total / insightsTotal) * (2 * Math.PI), 2 * Math.PI - 0.0005);
          var start = angle + gap / 2;
          var end = angle + sweep - gap / 2;
          if (end < start) end = start;
          donutSegments.push({ color: c.color, pathD: arcPath(60, 60, 54, 34, start, end) });
          angle += sweep;
        });
      }

      h += '<div style="background:#161a18;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:14px;">';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><div style="font-size:14px;font-weight:700;">Spend by category</div>';
      h += '<div style="display:flex;background:rgba(255,255,255,0.06);border-radius:10px;padding:3px;">';
      var dMode = s.categoryChartMode === 'donut';
      h += '<button onclick="App.setChartMode(\'donut\')" style="border:none;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;background:' + (dMode ? '#2fe6ac' : 'transparent') + ';color:' + (dMode ? '#06140f' : '#c3c2b7') + ';">Donut</button>';
      h += '<button onclick="App.setChartMode(\'bar\')" style="border:none;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;background:' + (!dMode ? '#2fe6ac' : 'transparent') + ';color:' + (!dMode ? '#06140f' : '#c3c2b7') + ';">Bars</button></div></div>';

      if (dMode) {
        h += '<div style="display:flex;justify-content:center;margin-bottom:16px;"><svg width="150" height="150" viewBox="0 0 120 120">';
        donutSegments.forEach(function (seg) { h += '<path d="' + seg.pathD + '" fill="' + seg.color + '"></path>'; });
        h += '<text x="60" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif">' + esc(fmtMoney(insightsTotal)) + '</text>';
        h += '<text x="60" y="73" text-anchor="middle" font-size="9.5" fill="#898781" font-family="system-ui,-apple-system,sans-serif">total spend</text></svg></div>';
        catTotalsRaw.forEach(function (c) {
          h += '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;"><div style="width:10px;height:10px;border-radius:3px;background:' + c.color + ';flex-shrink:0;"></div>';
          h += '<div style="flex:1;font-size:13px;color:#ffffff;">' + esc(c.name) + '</div>';
          h += '<div style="font-size:12px;color:#898781;">' + Math.round(c.total / insightsTotal * 100) + '%</div>';
          h += '<div style="font-size:13px;font-weight:600;min-width:64px;text-align:right;">' + esc(fmtMoney(c.total)) + '</div></div>';
        });
      } else {
        catTotalsRaw.forEach(function (c) {
          var wp = maxCatTotal ? (c.total / maxCatTotal * 100) : 0;
          h += '<div style="margin-bottom:11px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>' + esc(c.name) + '</span><span style="font-weight:600;">' + esc(fmtMoney(c.total)) + '</span></div>';
          h += '<div style="height:8px;border-radius:4px;background:rgba(255,255,255,0.10);overflow:hidden;"><div style="height:100%;border-radius:4px;width:' + wp + '%;background:' + c.color + ';"></div></div></div>';
        });
      }
      h += '</div>';

      var deltaSummary = deltaAmt === 0 ? ('Same total as ' + monthLabel(prevMonthKey)) : ('You spent ' + fmtMoney(Math.abs(deltaAmt)) + (deltaIsLess ? ' less than ' : ' more than ') + monthLabel(prevMonthKey));
      var deltaColor = deltaAmt === 0 ? '#c3c2b7' : (deltaIsLess ? '#0ca30c' : '#d03b3b');
      var maxVsValue = 1;
      CATEGORIES.forEach(function (c) {
        var t = insightsExpenses.filter(function (e) { return e.categoryId === c.id; }).reduce(function (a, e) { return a + e.amount; }, 0);
        var p = prevExpenses.filter(function (e) { return e.categoryId === c.id; }).reduce(function (a, e) { return a + e.amount; }, 0);
        maxVsValue = Math.max(maxVsValue, t, p);
      });
      h += '<div style="background:#161a18;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:14px;">';
      h += '<div style="font-size:14px;font-weight:700;margin-bottom:4px;">This month vs last month</div>';
      h += '<div style="font-size:12.5px;color:' + deltaColor + ';font-weight:600;margin-bottom:14px;">' + esc(deltaSummary) + '</div>';
      h += '<div style="display:flex;gap:14px;margin-bottom:10px;"><div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:3px;background:#2fe6ac;"></div><span style="font-size:11.5px;color:#c3c2b7;">This month</span></div>';
      h += '<div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,0.30);"></div><span style="font-size:11.5px;color:#c3c2b7;">Last month</span></div></div>';
      CATEGORIES.forEach(function (c) {
        var t = insightsExpenses.filter(function (e) { return e.categoryId === c.id; }).reduce(function (a, e) { return a + e.amount; }, 0);
        var p = prevExpenses.filter(function (e) { return e.categoryId === c.id; }).reduce(function (a, e) { return a + e.amount; }, 0);
        var tw = t / maxVsValue * 100, pw = p / maxVsValue * 100;
        if (tw <= 0.01 && pw <= 0.01) return;
        h += '<div style="margin-bottom:12px;"><div style="font-size:12.5px;margin-bottom:4px;">' + esc(c.name) + '</div>';
        h += '<div style="height:7px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;margin-bottom:3px;"><div style="height:100%;border-radius:4px;width:' + tw + '%;background:#2fe6ac;"></div></div>';
        h += '<div style="height:7px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;"><div style="height:100%;border-radius:4px;width:' + pw + '%;background:rgba(255,255,255,0.30);"></div></div></div>';
      });
      h += '</div>';

      var dim = daysInMonthOf(s.insightsMonth);
      var dayTotals = [];
      for (var d = 1; d <= dim; d++) dayTotals.push(0);
      insightsExpenses.forEach(function (e) { var dn = parseInt(e.date.slice(8, 10), 10); dayTotals[dn - 1] += e.amount; });
      var cum = 0; var cumSeries = [];
      for (var i = 0; i < dim; i++) { cum += dayTotals[i]; cumSeries.push(cum); }
      var maxCum = 1;
      for (var j = 0; j < cumSeries.length; j++) { if (cumSeries[j] > maxCum) maxCum = cumSeries[j]; }
      var VB_W = 320, VB_H = 130, padL = 6, padR = 6, padT = 8, padB = 8;
      var plotW = VB_W - padL - padR, plotH = VB_H - padT - padB;
      var points = cumSeries.map(function (v, idx) {
        var x = padL + (dim === 1 ? 0 : (idx / (dim - 1)) * plotW);
        var y = padT + plotH - (v / maxCum * plotH);
        return { x: x, y: y };
      });
      var linePath = points.map(function (p, idx) { return (idx === 0 ? 'M ' : 'L ') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
      var areaPath = linePath + ' L ' + points[points.length - 1].x.toFixed(1) + ' ' + (padT + plotH) + ' L ' + points[0].x.toFixed(1) + ' ' + (padT + plotH) + ' Z';
      var hoverIdx = (s.hoverDayIndex !== null && s.hoverDayIndex < dim) ? s.hoverDayIndex : (dim - 1);
      var hoverPoint = points[hoverIdx];
      var hoverLabel = 'Day ' + (hoverIdx + 1) + ' · ' + fmtMoney(cumSeries[hoverIdx]) + ' cumulative';

      h += '<div style="background:#161a18;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:14px;">';
      h += '<div style="font-size:14px;font-weight:700;margin-bottom:2px;">Daily running total</div>';
      h += '<div style="font-size:12px;color:#898781;margin-bottom:10px;">' + esc(hoverLabel) + '</div>';
      h += '<svg viewBox="0 0 320 130" width="100%" height="140" onmouseleave="App.onChartLeave()" style="overflow:visible;">';
      h += '<line x1="6" y1="8" x2="6" y2="122" stroke="rgba(255,255,255,0.10)" stroke-width="1"></line>';
      h += '<line x1="6" y1="122" x2="314" y2="122" stroke="rgba(255,255,255,0.25)" stroke-width="1"></line>';
      h += '<path d="' + areaPath + '" fill="rgba(47,230,172,0.16)" stroke="none"></path>';
      h += '<path d="' + linePath + '" fill="none" stroke="#2fe6ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>';
      h += '<circle cx="' + hoverPoint.x + '" cy="' + hoverPoint.y + '" r="4" fill="#2fe6ac" stroke="#0b0f0d" stroke-width="2"></circle>';
      points.forEach(function (p, idx) {
        var x = padL + (dim === 1 ? 0 : (idx / (dim - 1)) * plotW) - (plotW / dim / 2);
        h += '<rect x="' + Math.max(0, x) + '" y="0" width="' + (plotW / dim) + '" height="130" fill="transparent" onclick="App.onChartHover(' + idx + ')"></rect>';
      });
      h += '</svg></div>';

      var hasBudgetRows = false;
      var budgetRowsHtml = '';
      CATEGORIES.forEach(function (c) {
        var budget = s.budgets.byCategory[c.id] || null;
        if (!budget) return;
        hasBudgetRows = true;
        var spent = insightsExpenses.filter(function (e) { return e.categoryId === c.id; }).reduce(function (a, e) { return a + e.amount; }, 0);
        var pct = Math.min(100, spent / budget * 100);
        var barColor = spent / budget >= 1 ? '#d03b3b' : (spent / budget >= 0.8 ? '#fab219' : '#0ca30c');
        budgetRowsHtml += '<div style="margin-bottom:11px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>' + esc(c.name) + '</span><span style="color:#898781;">' + esc(fmtMoney(spent) + ' / ' + fmtMoney(budget)) + '</span></div>';
        budgetRowsHtml += '<div style="height:7px;border-radius:4px;background:rgba(255,255,255,0.12);overflow:hidden;"><div style="height:100%;border-radius:4px;width:' + pct + '%;background:' + barColor + ';"></div></div></div>';
      });
      if (hasBudgetRows) {
        h += '<div style="background:#161a18;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:14px;"><div style="font-size:14px;font-weight:700;margin-bottom:12px;">Budget progress</div>' + budgetRowsHtml + '</div>';
      }

      var topExpenses = insightsExpenses.slice().sort(function (a, b) { return b.amount - a.amount; }).slice(0, 5);
      if (topExpenses.length > 0) {
        h += '<div style="background:#161a18;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;"><div style="font-size:14px;font-weight:700;margin-bottom:10px;">Biggest expenses</div>';
        topExpenses.forEach(function (e) {
          var cat = CAT_BY_ID[e.categoryId];
          h += '<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);">';
          h += '<div style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + categoryIconSvg(e.categoryId, cat.color, 16) + '</div>';
          h += '<div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(e.note || cat.name) + '</div>';
          h += '<div style="font-size:11.5px;color:#898781;">' + esc(fmtDateGroup(e.date)) + '</div></div>';
          h += '<div style="font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;">' + esc(fmtMoney(e.amount)) + '</div></div>';
        });
        h += '</div>';
      }

      h += '</div>';
      return h;
    },

    renderNav: function () {
      var s = this.state;
      function navColor(tab) { return s.tab === tab ? '#2fe6ac' : '#898781'; }
      var h = '<div style="display:flex;align-items:stretch;border-top:1px solid rgba(255,255,255,0.08);background:#121614;padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0;">';
      h += '<button class="et-navbtn" onclick="App.selectTab(\'home\')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:' + navColor('home') + ';"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4.5l8 7"/><path d="M6 10.5v8.5a1 1 0 0 0 1 1h3.2v-5.3h3.6v5.3H17a1 1 0 0 0 1-1v-8.5"/></svg><span style="font-size:10.5px;font-weight:600;">Home</span></button>';
      h += '<button class="et-navbtn" onclick="App.selectTab(\'history\')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:' + navColor('history') + ';"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.1"/><circle cx="4.5" cy="12" r="1.1"/><circle cx="4.5" cy="18" r="1.1"/></svg><span style="font-size:10.5px;font-weight:600;">History</span></button>';
      h += '<button class="et-navbtn" onclick="App.selectTab(\'add\')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#2fe6ac;"><div style="width:38px;height:38px;border-radius:50%;background:#2fe6ac;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 14px rgba(47,230,172,0.5);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#06140f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div><span style="font-size:10.5px;font-weight:600;margin-top:-2px;">Add</span></button>';
      h += '<button class="et-navbtn" onclick="App.selectTab(\'budgets\')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:' + navColor('budgets') + ';"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l7.3 4.2"/></svg><span style="font-size:10.5px;font-weight:600;">Budgets</span></button>';
      h += '<button class="et-navbtn" onclick="App.selectTab(\'insights\')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:' + navColor('insights') + ';"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13.5M11 20V8M18 20v-6"/><path d="M2.5 20h19" stroke-linecap="round"/></svg><span style="font-size:10.5px;font-weight:600;">Insights</span></button>';
      h += '</div>';
      return h;
    },

    renderModal: function () {
      if (!this.state.confirmDeleteId) return '';
      return '<div style="position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:30px;">'
        + '<div style="background:#1c2220;border:1px solid rgba(255,255,255,0.10);border-radius:16px;padding:20px;width:100%;max-width:300px;">'
        + '<div style="font-size:15px;font-weight:700;margin-bottom:6px;">Delete expense?</div>'
        + '<div style="font-size:13px;color:#c3c2b7;margin-bottom:18px;">This can\'t be undone.</div>'
        + '<div style="display:flex;gap:8px;"><button class="et-btn-ghost" onclick="App.cancelDelete()" style="flex:1;">Cancel</button>'
        + '<button onclick="App.performDelete()" style="flex:1;background:#d03b3b;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Delete</button></div></div></div>';
    },

    renderToast: function () {
      if (!this.state.toastMsg) return '';
      return '<div class="et-toast" style="position:absolute;left:20px;right:20px;bottom:88px;background:#2fe6ac;color:#06140f;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:700;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,0.45);">' + esc(this.state.toastMsg) + '</div>';
    },

    renderBackup: function () {
      if (!this.state.showBackup) return '';
      var s = this.state;
      var h = '<div style="position:absolute;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:flex-end;justify-content:center;z-index:20;">';
      h += '<div style="background:#14181a;border:1px solid rgba(255,255,255,0.10);border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:88vh;overflow-y:auto;">';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;"><div style="font-size:17px;font-weight:700;">Backup &amp; restore</div>';
      h += '<button onclick="App.closeBackup()" style="background:none;border:none;color:#898781;font-size:22px;cursor:pointer;line-height:1;padding:4px;">&times;</button></div>';
      h += '<div style="font-size:12.5px;color:#898781;margin-bottom:14px;">Copy this text somewhere safe (like Notes) every so often. If this device ever loses its saved data, paste it back in below to restore everything.</div>';

      h += '<div style="font-size:12.5px;font-weight:700;color:#c3c2b7;margin-bottom:6px;">Your data (' + s.expenses.length + ' expense' + (s.expenses.length === 1 ? '' : 's') + ')</div>';
      h += '<textarea id="backupTextarea" readonly onclick="this.select()" style="width:100%;height:110px;background:#1c2220;color:#c3c2b7;border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:10px;font-size:11px;font-family:ui-monospace,monospace;resize:vertical;margin-bottom:8px;">' + esc(this.backupJson()) + '</textarea>';
      h += '<button class="et-btn-primary" onclick="App.copyBackup()" style="margin-bottom:22px;">Copy backup</button>';

      h += '<div style="font-size:12.5px;font-weight:700;color:#c3c2b7;margin-bottom:6px;">Restore from a backup</div>';
      h += '<textarea placeholder="Paste backup text here" oninput="App.onRestoreTextInput(this.value)" style="width:100%;height:80px;background:#1c2220;color:#ffffff;border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;resize:vertical;margin-bottom:8px;">' + esc(s.restoreText) + '</textarea>';
      if (s.restoreError) { h += '<div style="font-size:12.5px;color:#d03b3b;margin-bottom:8px;">' + esc(s.restoreError) + '</div>'; }
      h += '<button class="et-btn-ghost" onclick="App.restoreBackup()" style="width:100%;">Restore this backup</button>';
      h += '</div></div>';
      return h;
    }
  };

  window.App = App;
  App.load();
  App.render();
})();
</script>
