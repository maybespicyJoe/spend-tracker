<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
  </style>
</helmet>
<div style="display:inline-flex;align-items:center;justify-content:center;width:{{size}}px;height:{{size}}px;">
  <svg viewBox="0 0 24 24" width="{{size}}" height="{{size}}" style="display:block" fill="none" stroke="{{color}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <sc-if value="{{isGroceries}}" hint-placeholder-val="{{true}}">
      <path d="M6 8h12l-1.2 11.5a1 1 0 0 1-1 .9H8.2a1 1 0 0 1-1-.9L6 8z"/>
      <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
    </sc-if>
    <sc-if value="{{isDining}}" hint-placeholder-val="{{false}}">
      <path d="M8.5 2v6.5a1.3 1.3 0 0 0 2.6 0V2"/>
      <path d="M8.5 2v3.2M10.8 2v3.2M9.8 8.5V21"/>
      <path d="M15.5 2c1.8 2.6 1.8 5.4 0 7.5l-.8.9V21"/>
    </sc-if>
    <sc-if value="{{isTransport}}" hint-placeholder-val="{{false}}">
      <path d="M4 15.5l1.2-4.6A2 2 0 0 1 7.1 9.5h9.8a2 2 0 0 1 1.9 1.4l1.2 4.6"/>
      <path d="M2.8 15.5h18.4v3.2a1 1 0 0 1-1 1h-1.1a1 1 0 0 1-1-1v-1.2H6.1v1.2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3.2z"/>
      <circle cx="7.2" cy="18.4" r="1.3"/>
      <circle cx="16.8" cy="18.4" r="1.3"/>
    </sc-if>
    <sc-if value="{{isRent}}" hint-placeholder-val="{{false}}">
      <path d="M3.5 11L12 4l8.5 7"/>
      <path d="M5.5 10v9.5a1 1 0 0 0 1 1h4.2v-6.2h2.6v6.2h4.2a1 1 0 0 0 1-1V10"/>
    </sc-if>
    <sc-if value="{{isShopping}}" hint-placeholder-val="{{false}}">
      <path d="M8.2 3.6l3.8 2 3.8-2 3 2.8-2.4 2.4v11.3a1 1 0 0 1-1 1H8.6a1 1 0 0 1-1-1V8.8L5.2 6.4z"/>
    </sc-if>
    <sc-if value="{{isSubscriptions}}" hint-placeholder-val="{{false}}">
      <path d="M4 12a8 8 0 0 1 13.6-5.7M18.4 3.8v4.2h-4.2"/>
      <path d="M20 12a8 8 0 0 1-13.6 5.7M5.6 20.2V16h4.2"/>
    </sc-if>
    <sc-if value="{{isEntertainment}}" hint-placeholder-val="{{false}}">
      <path d="M3 9.2h18"/>
      <path d="M4.2 9.2l1.3-4h2.7l-1 4M9.4 9.2l1-4h2.7l-1 4M14.6 9.2l1-4h2.7l-1 4"/>
      <rect x="3" y="9.2" width="18" height="10.8" rx="1.4"/>
    </sc-if>
    <sc-if value="{{isTravel}}" hint-placeholder-val="{{false}}">
      <path d="M21 3L3.5 10l6.7 2.6M21 3l-6.5 17.5-2.3-7.9M21 3l-10.8 9.6"/>
    </sc-if>
  </svg>
</div>
</x-dc>
<script data-dc-script data-props='{"categoryId":{"editor":"enum","default":"groceries","options":["groceries","dining","transport","rent","shopping","subscriptions","entertainment","travel"]},"color":{"editor":"color","default":"#2a78d6"},"size":{"editor":"int","default":22,"min":14,"max":40}}'>
class Component extends DCLogic {
  renderVals() {
    var id = this.props.categoryId || 'groceries';
    return {
      size: this.props.size || 22,
      color: this.props.color || '#2a78d6',
      isGroceries: id === 'groceries',
      isDining: id === 'dining',
      isTransport: id === 'transport',
      isRent: id === 'rent',
      isShopping: id === 'shopping',
      isSubscriptions: id === 'subscriptions',
      isEntertainment: id === 'entertainment',
      isTravel: id === 'travel'
    };
  }
}
</script>
</body>
</html>
